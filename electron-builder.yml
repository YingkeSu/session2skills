appId: com.session2skills.app
productName: session2skills
copyright: Copyright © 2026 session2skills

directories:
  output: release
  buildResources: electron/build-resources

files:
  - dist/**
  - dist-electron/**
  - web/dist/**
  - node_modules/**/*
  - package.json

extraMetadata:
  main: dist-electron/main.js

mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  target:
    - nsis

linux:
  target:
    - AppImage
    - deb
